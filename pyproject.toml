[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinal-stab"
version = "0.1.0"
description = "Feature-based retinal video stabilization demo pipeline"
readme = "README.md"
authors = [{name = "Interview Demo"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9.0.80,<5",
    "numpy>=1.26,<2",
    "scipy>=1.12,<2",
    "PyYAML>=6.0",
    "matplotlib>=3.8,<4",
]

[project.urls]
Homepage = "https://github.com/example/retinal-video-stabilization-demo"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
